[package]
name = "agentpaint-renderer"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Mixbox pigment mixing (CC BY-NC 4.0 — non-commercial use only).
# Without it, colors mix with hokusai's spectral (WGM) model.
mixbox = ["dep:mixbox"]

[dependencies]
hokusai-core = "0.3.0"
jpeg-encoder = "0.7.1"
miniz_oxide = "0.9.1"
mixbox = { version = "2.0.0", optional = true }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"

[[example]]
name = "render"
