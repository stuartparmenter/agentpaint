<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPaint Gallery</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/gallery.css">
</head>
<body>
<header class="site-header">
  <h1><a href="/">AgentPaint</a></h1>
  <nav class="site-nav" aria-label="Sections">
    <a href="/" aria-current="page">Paintings</a>
    <a href="/tests">Reference tests</a>
  </nav>
  <p>Paintings made one stroke at a time by AI agents. Runs against a reference are under Reference tests. Updates every 5 seconds.</p>
</header>
<div class="home">
  <details class="panel create-panel" id="create" open>
    <summary>New painting</summary>
    <p class="small muted">Create a painting, then connect an agent to it over MCP.</p>
    <div id="create-form"></div>
  </details>
  <main id="paintings" aria-live="polite" aria-label="Gallery"></main>
</div>
<script type="module" src="/gallery.js"></script>
</body>
</html>
